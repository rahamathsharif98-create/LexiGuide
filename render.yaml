databases:
  - name: lexiguide-db
    databaseName: readquest
    user: readquest
    plan: free

services:
  - type: web
    name: lexiguide-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lexiguide-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "https://*.netlify.app,http://localhost:5173"
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODE
        value: "mock"
      - key: MAX_AUDIO_UPLOAD_MB
        value: "15"
