# Netlify configuration for LexiGuide Single Page Application (SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Route all SPA pages to index.html to prevent 404 errors on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for maximum performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security & Permissions headers for microphone and speech
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"
