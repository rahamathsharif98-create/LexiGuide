<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Geometric Circle 3D Radial Gradient -->
    <radialGradient id="circleGrad" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#4DD0E1"/>
      <stop offset="45%" stop-color="#00BCD4"/>
      <stop offset="85%" stop-color="#0097A7"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>

    <!-- Outer Soft Ring -->
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#E0F7FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B2EBF2" stop-opacity="0.2"/>
    </radialGradient>

    <filter id="shapeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#006064" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Soft Target Disk -->
  <circle cx="100" cy="100" r="92" fill="#F0FDFA"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#CCFBF1" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Main Geometric Circle -->
  <g filter="url(#shapeShadow)">
    <circle cx="100" cy="100" r="66" fill="url(#circleGrad)"/>

    <!-- Subtle Inner Highlight Rim -->
    <circle cx="100" cy="100" r="62" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.35"/>

    <!-- Glossy Top-Left Curve Highlight -->
    <ellipse cx="80" cy="72" rx="32" ry="16" fill="#FFFFFF" opacity="0.4" transform="rotate(-35 80 72)"/>
    <ellipse cx="74" cy="66" rx="14" ry="7" fill="#FFFFFF" opacity="0.6" transform="rotate(-35 74 66)"/>
  </g>
</svg>