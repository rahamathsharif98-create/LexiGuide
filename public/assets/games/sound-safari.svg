<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sky & Atmosphere Gradients -->
    <linearGradient id="soundSafariSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Lush Hills Gradients -->
    <linearGradient id="backHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="frontHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Glowing Sound Wave Gradients -->
    <linearGradient id="soundWave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#13cfe3" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="soundWave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Gradients for Bubbles and Sun -->
    <radialGradient id="morningSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bubbleGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#67e8f9" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8"/>
    </radialGradient>

    <radialGradient id="bubbleGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f472b6" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#db2777" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.8"/>
    </radialGradient>

    <radialGradient id="bubbleGrad3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#eab308" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#08233a" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="600" fill="url(#soundSafariSky)"/>

  <!-- Morning Sun with Acoustic Aura Rings -->
  <circle cx="640" cy="130" r="130" fill="url(#morningSun)" opacity="0.35"/>
  <circle cx="640" cy="130" r="85" fill="#fef9c3" opacity="0.85"/>
  <circle cx="640" cy="130" r="50" fill="#ffffff" opacity="0.95"/>

  <!-- Concentric Sound Rings from Sun/Sky -->
  <circle cx="640" cy="130" r="160" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="10 14" opacity="0.45"/>
  <circle cx="640" cy="130" r="210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="14 18" opacity="0.35"/>

  <!-- Fluffy Cartoon Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Left Cloud -->
    <ellipse cx="140" cy="95" rx="55" ry="22"/>
    <circle cx="120" cy="85" r="26"/>
    <circle cx="155" cy="80" r="32"/>
    <circle cx="180" cy="92" r="20"/>

    <!-- Center-Right Cloud -->
    <ellipse cx="420" cy="120" rx="70" ry="26"/>
    <circle cx="390" cy="108" r="32"/>
    <circle cx="435" cy="100" r="38"/>
    <circle cx="470" cy="115" r="26"/>
  </g>

  <!-- Distant Savanna Acacia Silhouettes & Mountain Ridge -->
  <path d="M 0 370 Q 180 320 380 355 T 800 340 L 800 600 L 0 600 Z" fill="url(#backHills)"/>

  <!-- Acacia Trees in mid-ground -->
  <g fill="#064e3b" opacity="0.75">
    <!-- Tree 1 -->
    <path d="M 110 330 Q 105 270 110 230 Q 70 215 40 210 Q 75 195 110 200 Q 140 185 180 200 Q 150 215 120 230 Z"/>
    <rect x="106" y="230" width="8" height="110" rx="3"/>
    <!-- Tree 2 -->
    <path d="M 710 320 Q 705 265 710 230 Q 670 215 640 210 Q 675 195 710 200 Q 740 185 780 200 Q 750 215 720 230 Z"/>
    <rect x="706" y="230" width="8" height="100" rx="3"/>
  </g>

  <!-- Front Rolling Savanna Hill -->
  <path d="M 0 420 Q 250 370 520 410 Q 680 435 800 415 L 800 600 L 0 600 Z" fill="url(#frontHills)"/>

  <!-- Sound Waves Emanating Across Center -->
  <g fill="none" stroke-linecap="round">
    <path d="M 280 290 Q 350 240 430 250 T 560 270" stroke="url(#soundWave1)" stroke-width="8"/>
    <path d="M 290 260 Q 380 200 470 215 T 600 240" stroke="url(#soundWave2)" stroke-width="6"/>
    <path d="M 310 230 Q 400 170 500 185 T 630 210" stroke="#fde047" stroke-width="4" stroke-dasharray="8 8" opacity="0.8"/>
  </g>

  <!-- Floating Phoneme Sound Bubbles -->
  <!-- Bubble 1: /k/ Sound -->
  <g transform="translate(190, 190)">
    <circle cx="0" cy="0" r="38" fill="url(#bubbleGrad1)" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="-12" cy="-14" r="7" fill="#ffffff" opacity="0.75"/>
    <text x="0" y="9" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#08233a" text-anchor="middle">/k/</text>
    <text x="24" y="-18" font-size="16">✨</text>
  </g>

  <!-- Bubble 2: Musical Note ♪ -->
  <g transform="translate(370, 160)">
    <circle cx="0" cy="0" r="32" fill="url(#bubbleGrad2)" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="-10" cy="-12" r="6" fill="#ffffff" opacity="0.8"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">🎵</text>
  </g>

  <!-- Bubble 3: /b/ Sound -->
  <g transform="translate(480, 220)">
    <circle cx="0" cy="0" r="34" fill="url(#bubbleGrad3)" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="-10" cy="-12" r="6" fill="#ffffff" opacity="0.8"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#78350f" text-anchor="middle">/b/</text>
    <text x="20" y="-14" font-size="14">🌟</text>
  </g>

  <!-- Bubble 4: /sh/ Sound -->
  <g transform="translate(620, 260)">
    <circle cx="0" cy="0" r="30" fill="url(#bubbleGrad1)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-9" cy="-10" r="5" fill="#ffffff" opacity="0.8"/>
    <text x="0" y="7" font-family="system-ui, sans-serif" font-size="19" font-weight="900" fill="#08233a" text-anchor="middle">/sh/</text>
  </g>

  <!-- LEFT HERO: Friendly Singing Baby Lion with Headphones -->
  <g transform="translate(260, 420)">
    <!-- Lion Mane Back -->
    <circle cx="0" cy="-25" r="76" fill="#d97706"/>
    <!-- Mane Tufts around circle -->
    <circle cx="-55" cy="-70" r="24" fill="#d97706"/>
    <circle cx="0" cy="-96" r="25" fill="#d97706"/>
    <circle cx="55" cy="-70" r="24" fill="#d97706"/>
    <circle cx="-75" cy="-25" r="24" fill="#d97706"/>
    <circle cx="75" cy="-25" r="24" fill="#d97706"/>
    <circle cx="-50" cy="20" r="22" fill="#d97706"/>
    <circle cx="50" cy="20" r="22" fill="#d97706"/>

    <!-- Inner Mane Ring -->
    <circle cx="0" cy="-25" r="66" fill="#f59e0b"/>

    <!-- Lion Ears -->
    <circle cx="-45" cy="-70" r="20" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
    <circle cx="-45" cy="-70" r="11" fill="#fed7aa"/>
    <circle cx="45" cy="-70" r="20" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
    <circle cx="45" cy="-70" r="11" fill="#fed7aa"/>

    <!-- Lion Face Base -->
    <circle cx="0" cy="-22" r="50" fill="#fde68a"/>

    <!-- Headphone Band Over Head -->
    <path d="M -54 -25 A 56 56 0 0 1 54 -25" fill="none" stroke="#0891b2" stroke-width="8" stroke-linecap="round"/>

    <!-- Big Eyes -->
    <ellipse cx="-18" cy="-28" rx="8" ry="11" fill="#1e293b"/>
    <ellipse cx="18" cy="-28" rx="8" ry="11" fill="#1e293b"/>
    <!-- Eye Highlights -->
    <circle cx="-16" cy="-32" r="3.5" fill="#ffffff"/>
    <circle cx="-19" cy="-25" r="1.8" fill="#ffffff"/>
    <circle cx="20" cy="-32" r="3.5" fill="#ffffff"/>
    <circle cx="17" cy="-25" r="1.8" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <circle cx="-32" cy="-14" r="8" fill="#f472b6" opacity="0.6"/>
    <circle cx="32" cy="-14" r="8" fill="#f472b6" opacity="0.6"/>

    <!-- Muzzle / Snout -->
    <ellipse cx="0" cy="-10" rx="20" ry="14" fill="#fffbeb"/>
    <!-- Nose -->
    <polygon points="0,-12 -8,-18 8,-18" fill="#78350f"/>
    <!-- Happy Singing Mouth -->
    <path d="M -10 -8 Q 0 -3 10 -8 Q 0 8 -10 -8 Z" fill="#b91c1c"/>
    <path d="M -6 0 Q 0 4 6 0" fill="#f87171"/>

    <!-- Headphone Earcups -->
    <rect x="-62" y="-40" width="16" height="32" rx="8" fill="#ec4899" stroke="#be185d" stroke-width="3"/>
    <rect x="46" y="-40" width="16" height="32" rx="8" fill="#ec4899" stroke="#be185d" stroke-width="3"/>

    <!-- Cute Body & Paws -->
    <path d="M -35 25 Q 0 15 35 25 L 45 90 L -45 90 Z" fill="#f59e0b"/>
    <ellipse cx="0" cy="55" rx="24" ry="28" fill="#fde68a"/>
    <!-- Paws on Ground -->
    <circle cx="-25" cy="85" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <circle cx="25" cy="85" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  </g>

  <!-- RIGHT HERO: Cheerful Singing Safari Parrot / Songbird -->
  <g transform="translate(560, 370)">
    <!-- Branch -->
    <path d="M -30 70 Q 30 65 90 75" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 40 70 Q 60 50 80 55" stroke="#16a34a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="82" cy="54" r="5" fill="#f43f5e"/>

    <!-- Bird Body -->
    <ellipse cx="25" cy="20" rx="30" ry="38" fill="#0284c7"/>
    <!-- Bird Belly -->
    <ellipse cx="15" cy="22" rx="18" ry="25" fill="#38bdf8"/>
    <!-- Bird Wing -->
    <path d="M 25 5 Q 50 25 35 55 Q 15 45 25 5 Z" fill="#2563eb"/>

    <!-- Bird Head -->
    <circle cx="20" cy="-20" r="25" fill="#0284c7"/>
    <!-- Eye Patch & Eye -->
    <circle cx="12" cy="-22" r="9" fill="#ffffff"/>
    <circle cx="10" cy="-22" r="5" fill="#0f172a"/>
    <circle cx="8" cy="-24" r="2" fill="#ffffff"/>

    <!-- Beak Open Singing -->
    <polygon points="2,-28 -28,-18 2,-16" fill="#f97316"/>
    <polygon points="2,-16 -20,-10 2,-8" fill="#ea580c"/>

    <!-- Crest Feathers -->
    <path d="M 28 -42 Q 40 -50 35 -35" stroke="#eab308" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 22 -44 Q 30 -55 24 -38" stroke="#ef4444" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Singing Notes coming from Parrot's Beak -->
    <g transform="translate(-45, -35)">
      <text x="0" y="0" font-size="22" fill="#ec4899">🎶</text>
      <text x="-18" y="-15" font-size="16" fill="#f59e0b">♪</text>
    </g>
  </g>

  <!-- Safari Flowers and Foliage Foreground -->
  <g fill="#10b981">
    <ellipse cx="60" cy="490" rx="35" ry="12" transform="rotate(-25 60 490)"/>
    <ellipse cx="100" cy="505" rx="40" ry="14" transform="rotate(20 100 505)"/>
    <circle cx="80" cy="485" r="12" fill="#ec4899"/>
    <circle cx="80" cy="485" r="6" fill="#fef08a"/>

    <ellipse cx="720" cy="500" rx="35" ry="12" transform="rotate(30 720 500)"/>
    <ellipse cx="680" cy="510" rx="40" ry="14" transform="rotate(-15 680 510)"/>
    <circle cx="700" cy="495" r="14" fill="#f59e0b"/>
    <circle cx="700" cy="495" r="7" fill="#ffffff"/>
  </g>

  <!-- Title Badge at Bottom: SOUND SAFARI -->
  <g transform="translate(400, 535)" filter="url(#badgeShadow)">
    <!-- Pill Backplate -->
    <rect x="-170" y="-30" width="340" height="60" rx="30" fill="#08233a" stroke="#13cfe3" stroke-width="4"/>
    <rect x="-166" y="-26" width="332" height="52" rx="26" fill="#0b5264" opacity="0.9"/>

    <!-- Inner Glow Strip -->
    <path d="M -140 -20 Q 0 -24 140 -20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Badge Icon and Label -->
    <text x="-135" y="8" font-size="26">🔊</text>
    <text x="-10" y="8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">SOUND SAFARI</text>
    <text x="125" y="8" font-size="24">🎵</text>
  </g>
</svg>
