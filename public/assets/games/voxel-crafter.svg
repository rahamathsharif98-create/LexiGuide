    <polygon points="-220,-30 0,60 0,180 -220,90" fill="#854d0e" stroke="#713f12" stroke-width="4"/>
    <polygon points="220,-30 0,60 0,180 220,90" fill="#a16207" stroke="#713f12" stroke-width="4"/>

    <g transform="translate(-110, -50)">
