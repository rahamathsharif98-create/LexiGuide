      <polygon points="35,-20 0,0 0,40 35,20" fill="#ca8a04" stroke="#713f12" stroke-width="2"/>
      <text x="0" y="-14" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#713f12" text-anchor="middle">T</text>
