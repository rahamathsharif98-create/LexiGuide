    <text x="0" y="12" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#be185d" text-anchor="middle">ER</text>
    <circle cx="0" cy="-45" r="14" fill="#ef4444"/>
    <polygon points="0,-55 -8,-45 8,-45" fill="#22c55e"/>
