<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Rich Royal Purple Splash Gradient -->
    <radialGradient id="purpleGrad" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#BA68C8"/>
      <stop offset="40%" stop-color="#9C27B0"/>
      <stop offset="85%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </radialGradient>

    <!-- Droplet Glow -->
    <radialGradient id="dropGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E1BEE7"/>
      <stop offset="60%" stop-color="#AB47BC"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </radialGradient>

    <!-- Wooden Brush Handle Gradient -->
    <linearGradient id="brushWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="40%" stop-color="#BCAAA4"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>

    <!-- Metal Ferrule Gradient -->
    <linearGradient id="metalFerrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="50%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>

    <filter id="purpleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4A148C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Soft Lavender Background Bubble -->
  <circle cx="100" cy="100" r="92" fill="#F3E5F5"/>

  <!-- Organic Dynamic Purple Paint Splat -->
  <g filter="url(#purpleShadow)">
    <path d="M100,52
             C120,40 148,58 142,82
             C165,85 178,110 160,132
             C168,155 145,172 125,162
             C108,178 78,172 70,154
             C45,162 30,135 44,112
             C25,95 42,65 72,74
             C82,52 92,48 100,52 Z"
          fill="url(#purpleGrad)"/>

    <!-- Glossy Highlight Sheens on Wet Paint -->
    <path d="M78,82 Q96,65 120,72 Q105,80 88,86 Z" fill="#FFFFFF" opacity="0.45"/>
    <ellipse cx="62" cy="116" rx="10" ry="5" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 62 116)"/>
    <ellipse cx="145" cy="110" rx="8" ry="4" fill="#FFFFFF" opacity="0.35" transform="rotate(40 145 110)"/>

    <!-- Radiating Flying Paint Splatter Droplets -->
    <circle cx="158" cy="56" r="6" fill="url(#dropGrad)"/>
    <circle cx="172" cy="74" r="3.5" fill="url(#dropGrad)"/>
    <circle cx="166" cy="154" r="5" fill="url(#dropGrad)"/>
    <circle cx="138" cy="178" r="4" fill="url(#dropGrad)"/>
    <circle cx="52" cy="168" r="5.5" fill="url(#dropGrad)"/>
    <circle cx="32" cy="138" r="4" fill="url(#dropGrad)"/>
    <circle cx="36" cy="72" r="5" fill="url(#dropGrad)"/>
    <circle cx="68" cy="42" r="4" fill="url(#dropGrad)"/>
    <circle cx="120" cy="38" r="4.5" fill="url(#dropGrad)"/>
  </g>

  <!-- Artist Paintbrush Tipped in Purple Paint (Diagonal) -->
  <g transform="translate(110, 100) rotate(-42)" filter="url(#purpleShadow)">
    <!-- Wooden Handle -->
    <path d="M-6,-85 L6,-85 L4,-15 L-4,-15 Z" fill="url(#brushWood)"/>
    <!-- Metal Ferrule -->
    <rect x="-5" y="-15" width="10" height="18" rx="1.5" fill="url(#metalFerrule)"/>
    <!-- Purple Paint-Soaked Bristles -->
    <path d="M-5,3 C-5,16 -7,28 0,38 C7,28 5,16 5,3 Z" fill="url(#purpleGrad)"/>
    <!-- Wet Drip on Tip -->
    <circle cx="0" cy="44" r="2.8" fill="#AB47BC"/>
  </g>
</svg>