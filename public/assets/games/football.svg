<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Field Turf Radial Gradient -->
    <radialGradient id="turfBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="70%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#43A047"/>
    </radialGradient>

    <!-- Football Leather Radial Gradient -->
    <radialGradient id="leatherGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A15327"/>
      <stop offset="45%" stop-color="#7C3310"/>
      <stop offset="85%" stop-color="#551F07"/>
      <stop offset="100%" stop-color="#3A1403"/>
    </radialGradient>

    <!-- White Stripe Gradient -->
    <linearGradient id="stripeWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>

    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#1B5E20" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Stadium Turf Background -->
  <circle cx="100" cy="100" r="92" fill="url(#turfBg)"/>

  <!-- Yard Lines on Field -->
  <line x1="25" y1="140" x2="175" y2="140" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <line x1="45" y1="60" x2="155" y2="60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Tilted Football -->
  <g transform="translate(100, 100) rotate(-35)" filter="url(#ballShadow)">
    <!-- Prolate Spheroid (Football body) -->
    <path d="M-68,0
             C-45,-42 45,-42 68,0
             C45,42 -45,42 -68,0 Z"
          fill="url(#leatherGrad)"/>

    <!-- Left White Stripe -->
    <path d="M-48,-24 C-42,-27 -40,-27 -36,-27 L-36,27 C-40,27 -42,27 -48,24 Z" fill="url(#stripeWhite)" opacity="0.95"/>

    <!-- Right White Stripe -->
    <path d="M36,-27 C40,-27 42,-27 48,-24 L48,24 C42,27 40,27 36,27 Z" fill="url(#stripeWhite)" opacity="0.95"/>

    <!-- Center Seam Line -->
    <line x1="-58" y1="0" x2="58" y2="0" stroke="#3A1403" stroke-width="2" opacity="0.7"/>

    <!-- Center White Laces -->
    <!-- Main Center Backbone -->
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 5 Cross Laces -->
    <line x1="-18" y1="-8" x2="-18" y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="-9"  y1="-8" x2="-9"  y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0"   y1="-8" x2="0"   y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="9"   y1="-8" x2="9"   y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="18"  y1="-8" x2="18"  y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Glossy Highlight Sheen -->
    <path d="M-40,-20 Q0,-32 40,-20 Q0,-24 -40,-20 Z" fill="#FFFFFF" opacity="0.3"/>
  </g>
</svg>