<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Starfish Coral Body Gradient -->
    <radialGradient id="starBodyGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="50%" stop-color="#FF5722"/>
      <stop offset="90%" stop-color="#E64A19"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>

    <!-- Suction Dots Gradient -->
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="70%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCA28"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#870000" flood-opacity="0.25"/>
    </filter>

    <!-- Soft Aura -->
    <filter id="waterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Water Bubble Ring -->
  <circle cx="100" cy="100" r="92" fill="#E0F7FA" opacity="0.6"/>
  <circle cx="160" cy="40" r="8" fill="#B2EBF2" opacity="0.7"/>
  <circle cx="35" cy="60" r="6" fill="#B2EBF2" opacity="0.6"/>
  <circle cx="165" cy="155" r="5" fill="#B2EBF2" opacity="0.6"/>
  <circle cx="30" cy="145" r="9" fill="#B2EBF2" opacity="0.7"/>

  <!-- Starfish Sea Creature -->
  <g filter="url(#starShadow)" transform="translate(100, 104)">
    <!-- 5 Starfish Arms with organic curved contours -->
    <!-- Top Arm -->
    <path d="M0,0 C-12,-25 -20,-55 0,-76 C20,-55 12,-25 0,0 Z" fill="url(#starBodyGrad)"/>
    <!-- Top-Right Arm -->
    <path d="M0,0 C18,-15 52,-30 72,-12 C60,12 32,18 0,0 Z" fill="url(#starBodyGrad)"/>
    <!-- Bottom-Right Arm -->
    <path d="M0,0 C25,12 50,45 35,68 C15,55 8,30 0,0 Z" fill="url(#starBodyGrad)"/>
    <!-- Bottom-Left Arm -->
    <path d="M0,0 C-8,30 -15,55 -35,68 C-50,45 -25,12 0,0 Z" fill="url(#starBodyGrad)"/>
    <!-- Top-Left Arm (cheerful wave) -->
    <path d="M0,0 C-32,18 -60,12 -72,-12 C-52,-30 -18,-15 0,0 Z" fill="url(#starBodyGrad)"/>

    <!-- Center Rounded Core -->
    <circle cx="0" cy="0" r="32" fill="url(#starBodyGrad)"/>

    <!-- Suction-Cup Decorative Speckles (Starfish Texture) -->
    <circle cx="0" cy="-48" r="4" fill="url(#dotGrad)"/>
    <circle cx="0" cy="-30" r="3" fill="url(#dotGrad)"/>
    <circle cx="48" cy="-8" r="4" fill="url(#dotGrad)"/>
    <circle cx="30" cy="-4" r="3" fill="url(#dotGrad)"/>
    <circle cx="28" cy="45" r="3.5" fill="url(#dotGrad)"/>
    <circle cx="-28" cy="45" r="3.5" fill="url(#dotGrad)"/>
    <circle cx="-48" cy="-8" r="4" fill="url(#dotGrad)"/>
    <circle cx="-30" cy="-4" r="3" fill="url(#dotGrad)"/>

    <!-- Highlight Sheen -->
    <ellipse cx="-10" cy="-12" rx="10" ry="6" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 -10 -12)"/>

    <!-- Cute Starfish Eyes -->
    <ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1A237E"/>
    <circle cx="-13" cy="-5" r="2.5" fill="#FFFFFF"/>
    <circle cx="-9" cy="2" r="1.2" fill="#FFFFFF"/>

    <ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1A237E"/>
    <circle cx="9" cy="-5" r="2.5" fill="#FFFFFF"/>
    <circle cx="13" cy="2" r="1.2" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <circle cx="-19" cy="8" r="5" fill="#FF1744" opacity="0.45"/>
    <circle cx="19" cy="8" r="5" fill="#FF1744" opacity="0.45"/>

    <!-- Happy Open Mouth -->
    <path d="M-6,7 Q0,16 6,7" stroke="#7F0000" stroke-width="2.5" stroke-linecap="round" fill="#D32F2F"/>
    <ellipse cx="0" cy="11" rx="3" ry="1.8" fill="#FF8A80"/>
  </g>
</svg>