<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Deep Space Radial Background -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="60%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#050B14"/>
    </radialGradient>

    <!-- Golden Visor Reflection Gradient -->
    <linearGradient id="visorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Spacesuit White Gradient -->
    <linearGradient id="suitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>

    <filter id="astroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#00BCD4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Outer Space Frame -->
  <circle cx="100" cy="100" r="92" fill="url(#spaceGrad)"/>

  <!-- Twinkling Stars in Deep Space -->
  <circle cx="35" cy="45" r="2.5" fill="#FFF9C4"/>
  <circle cx="165" cy="40" r="2" fill="#FFFFFF"/>
  <circle cx="170" cy="140" r="3" fill="#FFF9C4"/>
  <circle cx="30" cy="155" r="2" fill="#FFFFFF"/>
  <circle cx="85" cy="25" r="1.5" fill="#FFFFFF"/>
  <circle cx="140" cy="175" r="1.5" fill="#FFFFFF"/>
  <!-- Sparkle Cross Star -->
  <path d="M150,80 L152,85 L157,87 L152,89 L150,94 L148,89 L143,87 L148,85 Z" fill="#FFF59D"/>

  <!-- Floating Astronaut -->
  <g transform="translate(100, 100)" filter="url(#astroGlow)">
    <!-- Oxygen Life-Support Backpack -->
    <rect x="-38" y="-40" width="76" height="70" rx="14" fill="#90A4AE"/>
    <rect x="-34" y="-36" width="68" height="62" rx="12" fill="#B0BEC5"/>

    <!-- Spacesuit Torso -->
    <rect x="-28" y="-15" width="56" height="52" rx="16" fill="url(#suitGrad)"/>
    <!-- Cyan Chest Collar Band -->
    <path d="M-20,-15 L20,-15 L16,-8 L-16,-8 Z" fill="#00BCD4"/>
    <!-- Chest Control Panel -->
    <rect x="-14" y="-4" width="28" height="22" rx="6" fill="#37474F"/>
    <circle cx="-6" cy="3" r="3" fill="#00E676"/>
    <circle cx="4" cy="3" r="3" fill="#FF5252"/>
    <rect x="-8" y="9" width="16" height="4" rx="2" fill="#40C4FF"/>

    <!-- Left Leg -->
    <rect x="-22" y="32" width="18" height="30" rx="8" fill="url(#suitGrad)"/>
    <ellipse cx="-13" cy="62" rx="11" ry="6" fill="#78909C"/> <!-- Boot -->

    <!-- Right Leg -->
    <rect x="4" y="32" width="18" height="30" rx="8" fill="url(#suitGrad)"/>
    <ellipse cx="13" cy="62" rx="11" ry="6" fill="#78909C"/> <!-- Boot -->

    <!-- Left Arm (Resting on hip) -->
    <path d="M-28,-8 C-44,-2 -46,20 -36,26" stroke="url(#suitGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="-35" cy="27" r="7" fill="#78909C"/> <!-- Glove -->

    <!-- Right Arm (Cheerful Waving) -->
    <path d="M28,-8 C42,-18 45,-38 38,-48" stroke="url(#suitGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Waving Glove Hand -->
    <circle cx="37" cy="-50" r="8" fill="#78909C"/>
    <ellipse cx="33" cy="-56" rx="3.5" ry="5" fill="#78909C" transform="rotate(-20 33 -56)"/>
    <ellipse cx="40" cy="-57" rx="3.5" ry="5.5" fill="#78909C"/>

    <!-- Astronaut Spherical Bubble Helmet -->
    <circle cx="0" cy="-35" r="30" fill="url(#suitGrad)" stroke="#B0BEC5" stroke-width="2"/>

    <!-- Gold Mirrored Curved Visor -->
    <ellipse cx="0" cy="-34" rx="22" ry="17" fill="url(#visorGrad)"/>

    <!-- Glossy Star Reflection on Visor Glass -->
    <ellipse cx="-8" cy="-40" rx="10" ry="5" fill="#FFFFFF" opacity="0.65" transform="rotate(-25 -8 -40)"/>
    <circle cx="8" cy="-28" r="2" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>