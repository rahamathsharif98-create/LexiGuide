<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Warm Cozy Bakery Background -->
    <linearGradient id="bakeryBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="80%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>

    <!-- Wooden Counter Gradient -->
    <linearGradient id="woodCounter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="25%" stop-color="#8D6E63"/>
      <stop offset="70%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>

    <!-- Bear Fur 3D Gradient -->
    <radialGradient id="bearFur" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BCAAA4"/>
      <stop offset="50%" stop-color="#8D6E63"/>
      <stop offset="85%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </radialGradient>

    <!-- Bear Snout Gradient -->
    <radialGradient id="bearSnout" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="70%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </radialGradient>

    <!-- Chef Hat Gradient -->
    <linearGradient id="chefHat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>

    <!-- Golden Honey Cake Gradient -->
    <radialGradient id="honeyCake" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="85%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>

    <!-- Honey Drip Gradient -->
    <linearGradient id="honeyDrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Apron Gradient -->
    <linearGradient id="tealApron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA"/>
      <stop offset="60%" stop-color="#00ACC1"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cozyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#3E2723" flood-opacity="0.28"/>
    </filter>
    <filter id="warmGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Bakery Room Backdrop -->
  <rect width="600" height="400" fill="url(#bakeryBg)"/>

  <!-- Warm Bakery Shelf in Background -->
  <rect x="0" y="70" width="600" height="16" fill="#795548" filter="url(#cozyShadow)"/>
  <!-- Jars on shelf -->
  <g transform="translate(60, 25)" opacity="0.85">
    <rect x="0" y="10" width="28" height="35" rx="5" fill="#E1F5FE" stroke="#B0BEC5"/>
    <rect x="5" y="5" width="18" height="6" rx="2" fill="#8D6E63"/>
    <circle cx="14" cy="28" r="9" fill="#FFB300"/>
  </g>
  <g transform="translate(110, 30)" opacity="0.85">
    <rect x="0" y="10" width="24" height="30" rx="4" fill="#E1F5FE" stroke="#B0BEC5"/>
    <rect x="4" y="6" width="16" height="5" rx="2" fill="#8D6E63"/>
    <circle cx="12" cy="24" r="7" fill="#E91E63"/>
  </g>
  <!-- Pennant Bunting Garland -->
  <path d="M0,20 Q150,55 300,20 Q450,55 600,20" stroke="#FFF" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="50,26 65,52 80,27" fill="#FF80AB"/>
  <polygon points="120,32 135,58 150,32" fill="#4DD0E1"/>
  <polygon points="190,34 205,60 220,34" fill="#FFD54F"/>
  <polygon points="380,34 395,60 410,34" fill="#81C784"/>
  <polygon points="450,32 465,58 480,32" fill="#FF80AB"/>
  <polygon points="520,26 535,52 550,27" fill="#4DD0E1"/>

  <!-- Warm Wooden Counter in Foreground -->
  <rect x="0" y="295" width="600" height="105" fill="url(#woodCounter)" filter="url(#cozyShadow)"/>
  <rect x="0" y="295" width="600" height="8" fill="#BCAAA4" opacity="0.4"/>

  <!-- BELLA THE BAKING BEAR (Center Hero) -->
  <g filter="url(#cozyShadow)" transform="translate(300, 195)">
    <!-- Fluffy Bear Ears -->
    <!-- Left Ear -->
    <circle cx="-65" cy="-80" r="28" fill="url(#bearFur)"/>
    <circle cx="-65" cy="-80" r="16" fill="#FFCDD2"/>
    <!-- Right Ear -->
    <circle cx="65" cy="-80" r="28" fill="url(#bearFur)"/>
    <circle cx="65" cy="-80" r="16" fill="#FFCDD2"/>

    <!-- Bear Body & Soft Shoulders -->
    <ellipse cx="0" cy="70" rx="90" ry="70" fill="url(#bearFur)"/>

    <!-- Cute Teal Baker Apron -->
    <path d="M-45,25 L45,25 L60,110 L-60,110 Z" fill="url(#tealApron)"/>
    <path d="M-40,25 Q0,40 40,25" stroke="#00838F" stroke-width="3" fill="none"/>
    <!-- Heart pocket on apron -->
    <path d="M-12,55 A8,8 0 0,1 4,55 A8,8 0 0,1 20,55 Q20,70 4,82 Q-12,70 -12,55 Z" fill="#FF4081"/>

    <!-- Bear Head -->
    <circle cx="0" cy="-25" r="75" fill="url(#bearFur)"/>

    <!-- White Puffy Chef's Hat (Toque) -->
    <g transform="translate(0, -95)">
      <!-- Puffy cloud tops -->
      <circle cx="-35" cy="-20" r="30" fill="url(#chefHat)"/>
      <circle cx="0" cy="-35" r="35" fill="url(#chefHat)"/>
      <circle cx="35" cy="-20" r="30" fill="url(#chefHat)"/>
      <!-- Hat brim band -->
      <rect x="-42" y="-5" width="84" height="24" rx="6" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1.5"/>
      <line x1="-20" y1="0" x2="-20" y2="15" stroke="#B0BEC5" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="15" stroke="#B0BEC5" stroke-width="1.5"/>
      <line x1="20" y1="0" x2="20" y2="15" stroke="#B0BEC5" stroke-width="1.5"/>
    </g>

    <!-- Warm Muzzle / Snout -->
    <ellipse cx="0" cy="-10" rx="42" ry="32" fill="url(#bearSnout)"/>

    <!-- Cute Bear Nose -->
    <ellipse cx="0" cy="-25" rx="14" ry="10" fill="#3E2723"/>
    <ellipse cx="-4" cy="-28" rx="4" ry="2" fill="#FFF" opacity="0.6"/>

    <!-- Gentle Mouth -->
    <path d="M0,-15 L0,-6" stroke="#4E342E" stroke-width="3"/>
    <path d="M-12,-8 Q0,6 12,-8" stroke="#4E342E" stroke-width="3.5" stroke-linecap="round" fill="#D32F2F"/>
    <path d="M-6,-2 Q0,3 6,-2" stroke="#FF8A80" stroke-width="2" fill="none"/>

    <!-- Cute Eyes with shine -->
    <ellipse cx="-28" cy="-36" rx="9" ry="12" fill="#2E1C0C"/>
    <circle cx="-31" cy="-40" r="4.5" fill="#FFF"/>
    <circle cx="-25" cy="-30" r="2" fill="#FFF"/>

    <ellipse cx="28" cy="-36" rx="9" ry="12" fill="#2E1C0C"/>
    <circle cx="25" cy="-40" r="4.5" fill="#FFF"/>
    <circle cx="31" cy="-30" r="2" fill="#FFF"/>

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="-44" cy="-18" rx="12" ry="7" fill="#FF7043" opacity="0.5"/>
    <ellipse cx="44" cy="-18" rx="12" ry="7" fill="#FF7043" opacity="0.5"/>

    <!-- Fluffy Bear Paws Holding Wooden Platter -->
    <!-- Left Paw -->
    <ellipse cx="-80" cy="55" rx="20" ry="16" fill="url(#bearFur)" transform="rotate(25 -80 55)"/>
    <circle cx="-75" cy="50" r="5" fill="#FFCDD2"/>
    <!-- Right Paw -->
    <ellipse cx="80" cy="55" rx="20" ry="16" fill="url(#bearFur)" transform="rotate(-25 80 55)"/>
    <circle cx="75" cy="50" r="5" fill="#FFCDD2"/>
  </g>

  <!-- HONEY CAKE ON WOODEN STAND (Front and center, mouth-watering!) -->
  <g filter="url(#cozyShadow)" transform="translate(300, 260)">
    <!-- Round Cake Stand Board -->
    <ellipse cx="0" cy="50" rx="95" ry="24" fill="#D7CCC8"/>
    <ellipse cx="0" cy="48" rx="90" ry="20" fill="#BCAAA4"/>

    <!-- 2-Tier Golden Honey Sponge Cake -->
    <!-- Bottom Cake Layer -->
    <path d="M-65,30 C-65,45 65,45 65,30 L65,15 C65,30 -65,30 -65,15 Z" fill="url(#honeyCake)"/>
    <!-- Cream Filling -->
    <ellipse cx="0" cy="15" rx="65" ry="16" fill="#FFF8E1"/>
    <!-- Top Cake Layer -->
    <path d="M-55,10 C-55,25 55,25 55,10 L55,-5 C55,10 -55,10 -55,-5 Z" fill="url(#honeyCake)"/>
    <ellipse cx="0" cy="-5" rx="55" ry="15" fill="url(#honeyCake)"/>

    <!-- Glossy Dripping Honey Glaze -->
    <path d="M-52,-4 Q-40,8 -30,-2 Q-20,12 -8,-4 Q5,15 18,-2 Q32,10 44,-3 Q55,-5 52,-4 C35,12 -35,12 -52,-4 Z" fill="url(#honeyDrip)"/>
    <!-- Drip Drops -->
    <path d="M-15,6 Q-12,24 -15,26 Q-18,24 -15,6 Z" fill="url(#honeyDrip)"/>
    <path d="M22,4 Q25,20 22,22 Q19,20 22,4 Z" fill="url(#honeyDrip)"/>

    <!-- Fresh Strawberries & Blueberries on top of cake -->
    <circle cx="-20" cy="-10" r="8" fill="#F44336"/>
    <circle cx="-22" cy="-12" r="2" fill="#FFF" opacity="0.6"/>
    <circle cx="0" cy="-12" r="9" fill="#E91E63"/>
    <circle cx="-2" cy="-15" r="2.5" fill="#FFF" opacity="0.6"/>
    <circle cx="18" cy="-8" r="7.5" fill="#3F51B5"/>

    <!-- Warm Rising Steam Aromas -->
    <path d="M-25,-25 Q-35,-45 -20,-60" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M2,-30 Q12,-50 0,-70" stroke="#FFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M28,-22 Q38,-42 25,-58" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Honey Pot with Dipper on Side of Counter -->
  <g transform="translate(100, 275)" filter="url(#cozyShadow)">
    <ellipse cx="20" cy="35" rx="24" ry="20" fill="#FF8F00"/>
    <ellipse cx="20" cy="20" rx="20" ry="10" fill="#FFE082"/>
    <ellipse cx="20" cy="20" rx="15" ry="7" fill="#FFB300"/>
    <!-- Honey Label -->
    <rect x="7" y="27" width="26" height="15" rx="3" fill="#FFF" opacity="0.9"/>
    <text x="20" y="38" font-family="sans-serif" font-size="9" font-weight="bold" fill="#E65100" text-anchor="middle">HONEY</text>
    <!-- Honey dipper stick -->
    <line x1="30" y1="20" x2="48" y2="-5" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="-2" r="6" fill="#FFB300"/>
  </g>

  <!-- Little Forest Friends Paw Prints & Sparkles -->
  <g fill="#FFFDE7" opacity="0.9" filter="url(#warmGlow)">
    <path d="M480,140 L483,148 L491,150 L483,152 L480,160 L477,152 L469,150 L477,148 Z"/>
    <path d="M140,160 L142,166 L148,168 L142,170 L140,176 L138,170 L132,168 L138,166 Z"/>
    <circle cx="490" cy="220" r="3"/>
    <circle cx="120" cy="230" r="2.5"/>
  </g>
</svg>
